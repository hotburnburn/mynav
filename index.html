<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyNav</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
.open-mode { position: fixed; bottom: 20px; right: 20px; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: #303030; box-shadow: 0 2px 8px #0004; font: 14px sans-serif; color: #aaa; }
.open-mode-current { color: white; font-weight: bold; }
.open-mode:has([aria-checked="true"]) .open-mode-current { color: #aaa; font-weight: normal; }
.open-mode:has([aria-checked="true"]) .open-mode-new { color: white; font-weight: bold; }
#openModeBtn { position: relative; width: 48px; height: 28px; padding: 0; border: 0; border-radius: 14px; background: #626262; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
#openModeBtn::before { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: white; transition: transform 0.2s; }
#openModeBtn[aria-checked="true"] { background: #409eff; }
#openModeBtn[aria-checked="true"]::before { transform: translateX(20px); }
#openModeBtn:focus-visible { outline: 2px solid white; outline-offset: 4px; }
@media (prefers-reduced-motion: reduce) { #openModeBtn, #openModeBtn::before { transition: none; } }
.utility-button { position: fixed; right: 20px; z-index: 10; padding: 12px 16px; border: none; border-radius: 10px; background: #303030; box-shadow: 0 2px 8px #0004; font: 14px sans-serif; line-height: 20px; color: #eee; cursor: pointer; transition: background 0.2s; }
.utility-button:hover { background: #3c3c3c; }
.utility-button:active { background: #454545; }
.utility-button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
#unlockBtn { bottom: 136px; }
#exportBtn { bottom: 84px; }
@media (prefers-reduced-motion: reduce) { .utility-button { transition: none; } }
</style>
</head>

<body>
    <div class="open-mode">
        <span class="open-mode-current">当前页面打开</span>
        <button id="openModeBtn" type="button" role="switch" aria-checked="false"
            aria-label="新页面打开" title="点击切换为新页面打开"></button>
        <span class="open-mode-new">新页面打开</span>
    </div>
    <button id="unlockBtn" class="utility-button" type="button">
        加载私密链接 🔐
    </button>
    <button id="exportBtn" class="utility-button" type="button">
        导出并清理记录
    </button>
    <script src="nav2.js"></script>
</body>

</html>
